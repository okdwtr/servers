# Traefik Dashboard の公開設定
# - Host(`traefik.domain.tld`) で /dashboard と /api を公開
# - 認証ミドルウェアは将来有効化できるようコメントアウトで準備

http:
  routers:
    traefik-dashboard:
      entryPoints:
        - websecure
      rule: Host(`traefik.domain.tld`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      service: api@internal
      tls: {}
      # middlewares:
      #   - traefik-dashboard-auth

