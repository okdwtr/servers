# Traefik 静的設定ファイル
# - コンテナ起動定義（compose）と分離して見通しを向上

entryPoints:
  ssh:
    address: ":22"
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  # Docker ラベルから動的ルーティング情報を取得
  docker:
    exposedByDefault: false

  # ファイルから動的ルーティング情報を取得
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true
  # API/Dashboard をエントリポイント経由でのみ公開するため無効化
  insecure: false

log:
  level: INFO

accessLog: {}
