services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped

    # 外部公開ポート（HTTP/HTTPS）
    ports:
      - "80:80"
      - "443:443"

    # Traefik 設定ファイル（静的設定）を明示
    command:
      - --configFile=/etc/traefik/traefik.yml

    # Dashboard 公開（compose ラベル管理）
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.domain.tld`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.service=api@internal
      # - traefik.http.routers.traefik-dashboard.middlewares=traefik-dashboard-auth
      # - traefik.http.middlewares.traefik-dashboard-auth.basicauth.users=admin:REPLACE_WITH_HTPASSWD_HASH

    volumes:
      # Docker provider 用: コンテナラベルの監視
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # 静的設定ファイル
      - ./traefik.yml:/etc/traefik/traefik.yml:ro

      # File provider 用: 動的設定ファイル
      - ./dynamic:/etc/traefik/dynamic:ro

    networks:
      - proxy

networks:
  proxy:
    name: proxy
