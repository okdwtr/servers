services:
  traefik:
    image: traefik:v3.6.15
    container_name: traefik
    restart: unless-stopped

    # 外部公開ポート（HTTP/HTTPS）
    ports:
      - "80:80"
      - "443:443"

    # Traefik 設定ファイル（静的設定）を明示
    command:
      - --configFile=/etc/traefik/traefik.yml

    # Dashboard 公開（compose ラベル管理）
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # HTTP dashboard
      - traefik.http.routers.traefik-dashboard-http.rule=Host(`traefik.example.com`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      - traefik.http.routers.traefik-dashboard-http.entrypoints=web
      - traefik.http.routers.traefik-dashboard-http.service=api@internal
      # - traefik.http.routers.traefik-dashboard-http.middlewares=redirect-to-https
      # - traefik.http.routers.traefik-dashboard-http.middlewares=traefik-dashboard-auth

      # HTTPS dashboard
      - traefik.http.routers.traefik-dashboard-https.rule=Host(`traefik.example.com`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      - traefik.http.routers.traefik-dashboard-https.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard-https.tls=true
      - traefik.http.routers.traefik-dashboard-https.service=api@internal
      # - traefik.http.routers.traefik-dashboard-https.middlewares=traefik-dashboard-auth

      # Middleware
      # - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # - traefik.http.middlewares.traefik-dashboard-auth.basicauth.users=admin:REPLACE_WITH_HTPASSWD_HASH

    volumes:
      # Docker provider 用: コンテナラベルの監視
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # 静的設定ファイル
      - ./traefik.yml:/etc/traefik/traefik.yml:ro

      # File provider 用: 動的設定ファイル
      - ./dynamic:/etc/traefik/dynamic:ro

    networks:
      - proxy

networks:
  proxy:
    name: proxy
