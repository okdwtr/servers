services:
  # Portainer CE: Docker コンテナを Web UI から管理するためのツール
  # Traefik / GitLab はここでは管理しない（CLI で起動・管理する運用を維持）
  portainer:
    image: portainer/portainer-ce:2.41.0
    container_name: portainer
    # 予期しない停止時に自動再起動する（手動 stop 時は再起動しない）
    restart: unless-stopped
    security_opt:
      # 子プロセスが追加の権限を取得するのを防ぐ
      - no-new-privileges:true
    volumes:
      # Portainer がホスト上のコンテナを管理するため Docker ソケットをマッピング
      - /var/run/docker.sock:/var/run/docker.sock
      # Portainer の設定・認証情報などを永続化するボリューム
      - portainer_data:/data
    # Traefik と共有する外部ネットワークに接続
    networks:
      - proxy
    # Traefik によるルーティング設定（ラベルで管理）
    labels:
      # Traefik によるルーティングを有効化
      - traefik.enable=true
      # 接続するネットワークを明示
      - traefik.docker.network=proxy

      # Portainer Web HTTPS
      # ドメインは .env の PORTAINER_DOMAIN で設定する
      - traefik.http.routers.portainer.rule=Host(`${PORTAINER_DOMAIN}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true

      # バックエンドポート（Portainer デフォルト: 9000）
      - traefik.http.services.portainer.loadbalancer.server.port=9000

volumes:
  # Portainer の設定データを永続化する名前付きボリューム
  portainer_data:
    name: portainer_data

networks:
  # Traefik が管理する外部ネットワーク（先に traefik 側で作成済みであること）
  proxy:
    external: true
